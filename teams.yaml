# Each entry becomes one .ics file in feeds/.
#
#   label     Prefix for every event title. Basecamp shows this text, so make it
#             say whose game it is.
#   url       The team's schedule page.
#   output    File name written to feeds/. Changing it changes the feed URL,
#             so basecamp would need the new one. Game IDs are built from it,
#             so the label can be renamed freely.
#   platform  Which site parser to use. Only "amais" exists so far
#             (Loyola Academy / goramblers.org and other AMAIS school sites).
#   duration_minutes  Optional. How long each game block is. Default 90.
#
# To add a team: copy a block, change the values, commit. The next run
# (weekly, or Actions -> "Update feeds" -> Run workflow) creates the file.

teams:
  - label: "Maddie — Basketball"
    url: https://www.goramblers.org/basketball---girls---varsity
    output: maddie-basketball.ics
    platform: amais

  - label: "Ryan — Sophomore Basketball"
    url: https://www.goramblers.org/basketball---boys---sophomore
    output: ryan-basketball.ics
    platform: amais
